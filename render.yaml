services:
  - type: web
    name: nucleus42
    runtime: python
    plan: free
    branch: main
    buildCommand: python -m pip install --upgrade pip && pip install flask gunicorn
    startCommand: gunicorn serve_forecast:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120
    healthCheckPath: /healthz
    autoDeployTrigger: commit
