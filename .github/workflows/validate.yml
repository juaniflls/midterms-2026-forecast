name: Validate v30 publication

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation and web dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nbformat openpyxl
          pip install -r dash_app/requirements.txt
      - name: Validate repository
        run: python scripts/validate_repository.py
      - name: Validate Render wrapper
        run: python dash_app/check_setup.py
      - name: Compile application
        run: python -m compileall -q dash_app
